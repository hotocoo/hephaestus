name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  HEPHAESTUS_TEST_DATABASE_URL: postgres://hephaestus:hephaestus@localhost:5432/hephaestus_test

jobs:
  rust:
    name: Rust - format, lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hephaestus
          POSTGRES_PASSWORD: hephaestus
          POSTGRES_DB: hephaestus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (unit + property + database integration)
        run: cargo test --workspace

  web:
    name: Web - typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The web workspace lands with Phase 9; this job activates when
      # pnpm-workspace.yaml exists. Kept green by construction until then.
      - name: Check for web workspace
        id: web
        run: echo "exists=$([ -f pnpm-workspace.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.web.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: steps.web.outputs.exists == 'true'
        run: pnpm -r typecheck
      - name: Lint
        if: steps.web.outputs.exists == 'true'
        run: pnpm -r lint
      - name: Test
        if: steps.web.outputs.exists == 'true'
        run: pnpm -r test
