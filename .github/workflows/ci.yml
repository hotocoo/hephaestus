name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  HEPHAESTUS_TEST_DATABASE_URL: postgres://hephaestus:hephaestus@localhost:5432/hephaestus_test

jobs:
  rust:
    name: Rust - format, lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hephaestus
          POSTGRES_PASSWORD: hephaestus
          POSTGRES_DB: hephaestus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (unit + property + database integration)
        run: cargo test --workspace

  web:
    name: Web - typecheck, lint, conformance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hephaestus
          POSTGRES_PASSWORD: hephaestus
          POSTGRES_DB: hephaestus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HEPHAESTUS_TEST_DATABASE_URL: postgres://hephaestus:hephaestus@localhost:5432/hephaestus_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: web-tier
      # Conformance and drift tests spawn the real server binary; the
      # web tier is only honest when it validates against the live API.
      - name: Build control-plane server binary
        run: cargo build -p hephaestus-api --bin hephaestus-server
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint
        run: pnpm -r lint
      - name: Test (live conformance included)
        run: pnpm -r test
